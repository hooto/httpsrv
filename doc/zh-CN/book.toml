[book]
title = "httpsrv 文档"
description = "一个轻量、net/http 原生的 Go Web 框架。"
language = "zh-CN"
src = "."

# Build into the shared output tree so the two books live under one site:
#   doc/book/        (English)
#   doc/book/zh-CN/  (this book)
# Path is relative to the book root (doc/zh-CN).
[build]
build-dir = "../book/zh-CN"

[output.html]
default-theme = "light"
git-repository-url = "https://github.com/hooto/httpsrv"

# mdBook's link adjuster rewrites cross-references to README.md as "README.html",
# but README.md is actually rendered to "index.html". This redirect makes those
# links (e.g. the language switcher in the sidebar) land on the right page.
[output.html.redirect]
"README.html" = "index.html"
